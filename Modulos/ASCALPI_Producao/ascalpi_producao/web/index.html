<a class="pular" href="#app">Ir para o conteúdo</a>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/painel" aria-label="ASCALPI Produção — painel">
      <span class="brand-mark"><svg><use href="#i-factory"/></svg></span>
      <span class="brand-text"><b>ASCALPI</b><small>PRODUÇÃO · ORDENS DE PRODUÇÃO</small></span>
    </a>
    <div class="busca-global" role="search">
      <svg><use href="#i-search"/></svg>
      <input id="busca-global" type="search" autocomplete="off" placeholder="Buscar O.P., obra ou cliente" aria-label="Buscar O.P., obra ou cliente" aria-controls="busca-resultados">
      <kbd>/</kbd>
      <div id="busca-resultados" class="busca-resultados" role="listbox" hidden></div>
    </div>
    <div class="top-actions">
      <span id="status-sistema" class="system-status"><i></i><b>SISTEMA PRONTO</b></span>
      <span class="proxima-chip" title="Número da próxima O.P."><small>PRÓXIMA O.P.</small><b id="proxima-num">—</b></span>
      <button class="btn ghost small" id="b-atualizar" type="button" title="Atualizar dados (R)"><svg><use href="#i-refresh"/></svg><span>ATUALIZAR</span></button>
    </div>
  </div>
  <div class="progresso" aria-hidden="true"><i></i></div>
</header>

<nav class="module-nav" aria-label="Telas do módulo">
  <a class="module-tab" href="#/painel" data-tela="painel"><svg><use href="#i-chart"/></svg><span>PAINEL</span><small>VISÃO DA PRODUÇÃO</small></a>
  <a class="module-tab" href="#/nova" data-tela="nova"><svg><use href="#i-plus"/></svg><span>NOVA O.P.</span><small>GERAR ORDEM</small></a>
  <a class="module-tab" href="#/ordens" data-tela="ordens"><svg><use href="#i-clipboard"/></svg><span>ORDENS</span><small>CONTROLE E ACOMPANHAMENTO</small></a>
  <a class="module-tab" href="#/saldos" data-tela="saldos"><svg><use href="#i-scale"/></svg><span>SALDOS</span><small>CONTRATOS E ATAS</small></a>
  <a class="module-tab" href="#/modelos" data-tela="modelos"><svg><use href="#i-layers"/></svg><span>MODELOS</span><small>PREFEITURAS E FOTOS</small></a>
  <a class="module-tab" href="#/config" data-tela="config"><svg><use href="#i-gear"/></svg><span>CONFIGURAÇÃO</span><small>PASTAS E PDF</small></a>
</nav>

<main id="app" class="page-shell" tabindex="-1"></main>

<div id="gaveta-fundo" class="gaveta-fundo" hidden></div>
<aside id="gaveta" class="gaveta" role="dialog" aria-modal="true" aria-labelledby="g-titulo" aria-hidden="true">
  <div class="gaveta-conteudo" id="gaveta-conteudo"></div>
</aside>

<dialog id="dlg" class="dialog">
  <form method="dialog" class="dialog-shell">
    <header><div><h3 id="dlg-titulo"></h3><p id="dlg-sub"></p></div><button class="icon-button" value="nao" type="submit" aria-label="Fechar"><svg><use href="#i-close"/></svg></button></header>
    <div class="dialog-body" id="dlg-corpo"></div>
    <footer><button class="btn ghost" value="nao" type="submit" id="dlg-nao">VOLTAR</button><button class="btn primary" value="sim" type="submit" id="dlg-sim">CONFIRMAR</button></footer>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
